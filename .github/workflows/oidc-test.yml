name: DeployPulse AWS OIDC Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose OIDC claims safely
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          params = urllib.parse.parse_qsl(
              urllib.parse.urlparse(url).query,
              keep_blank_values=True
          )
          params = [(k, v) for k, v in params if k != "audience"]
          params.append(("audience", "sts.amazonaws.com"))
          parts = urllib.parse.urlparse(url)
          url = urllib.parse.urlunparse(
              parts._replace(query=urllib.parse.urlencode(params))
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          safe_claims = {
              key: claims.get(key)
              for key in (
                  "iss", "aud", "sub", "repository",
                  "ref", "job_workflow_ref"
              )
          }
          print(json.dumps(safe_claims, indent=2))
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::749680934466:role/deploypulse-github-actions-role
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity
