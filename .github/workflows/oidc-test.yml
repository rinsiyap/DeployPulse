name: DeployPulse AWS OIDC Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::749680934466:role/deploypulse-github-actions-role
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity
