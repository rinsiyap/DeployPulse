name: DeployPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --upgrade pip

      - name: Compile Python files
        run: python -m py_compile app/taskflow/lambda_function.py app/incident_classifier/lambda_function.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
